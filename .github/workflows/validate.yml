name: Validate mahjong logic

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate mahjong logic / validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run shared release checks
        uses: ./.github/actions/release-checks
